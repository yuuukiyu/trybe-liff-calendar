<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏃 TRYBE予約カレンダー</title>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- app style -->
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <h1 id="calendarTitle">🏃 TRYBE予約カレンダー</h1>
<!-- 管理者専用：セッション追加フォーム -->
<div id="adminSection" style="display:none; margin: 20px 0;">
  <h3>📅 新しいセッションを追加</h3>
  <input id="eventTitle" placeholder="タイトル (例: TRYBE朝ラン)" />
  <input id="eventDate" type="date" />
  <input id="eventTime" type="time" />
  <input id="eventPlace" placeholder="場所 (例: 大磯海岸)" />
  <button id="addEventBtn">＋ セッション追加</button>
</div>

  <!-- あなたの予約セッション -->
  <div id="mySessions">
    <strong>あなたの予約セッション：</strong>
    <ul id="mySessionList">
      <li>読み込み中...</li>
    </ul>
  </div>

  <!-- カレンダー -->
  <div id="calendar"></div>

  <!-- モーダル -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle"></h3>
      <ul id="participantList"></ul>
      <input id="nameInput" placeholder="あなたの名前を入力" />
      <div class="btn-row">
        <button id="joinBtn">参加する</button>
        <button id="cancelBtn" class="cancel">キャンセル</button>
        <button id="closeBtn" class="close">閉じる</button>
      </div>
    </div>
  </div>

  <!-- app script -->
  <script type="module" src="./main.js"></script>
</body>
</html>
