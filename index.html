<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏃 TRYBE予約カレンダー</title>

  <!-- 🔥 FullCalendar（ESM 版のみ） -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.1/dist/umd/supabase.min.js"></script>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <h1>🏃 TRYBE予約カレンダー</h1>

  <button id="openAdminModalBtn" style="display:none; margin:15px;">＋ セッション追加</button>

  <div id="adminModal" class="modal">
    <div class="modal-content">
      <h3>📅 新しいセッションを追加</h3>
      <input id="eventTitle" />
      <input id="eventDate" type="date" />
      <input id="eventTime" type="time" />
      <input id="eventPlace" />
      <div class="btn-row">
        <button id="addEventBtn">追加</button>
        <button id="closeAdminModalBtn" class="close">閉じる</button>
      </div>
    </div>
  </div>

  <div id="deleteSessionModal" class="modal">
    <div class="modal-content">
      <h3>🗑 セッション削除</h3>
      <ul id="deleteSessionList"></ul>
      <button id="closeDeleteModal" class="close">閉じる</button>
    </div>
  </div>

  <div id="pastSessionsModal" class="modal">
    <div class="modal-content">
      <h3>📜 過去セッション一覧</h3>
      <ul id="pastSessionsList"></ul>
      <button id="closePastModal" class="close">閉じる</button>
    </div>
  </div>

  <div id="mySessions">
    <strong>あなたの予約セッション：</strong>
    <ul id="mySessionList"><li>読み込み中...</li></ul>
  </div>

  <div id="calendar"></div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle"></h3>
      <ul id="participantList"></ul>
      <input id="nameInput" />
      <div class="btn-row">
        <button id="joinBtn">参加する</button>
        <button id="cancelBtn">キャンセル</button>
        <button id="closeBtn" class="close">閉じる</button>
      </div>
    </div>
  </div>

  <!-- app.js（必ず最後） -->
  <script type="module" src="./app.js?v=3"></script>
</body>
</html>
