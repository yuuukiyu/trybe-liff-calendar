<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏃 TRYBE予約カレンダー</title>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: "Noto Sans JP", sans-serif;
      margin: 0;
      background: #f9f9f9;
      text-align: center;
    }

    h1 { margin: 20px 0; }

    #calendar {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 10px;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #fff;
      border-radius: 12px;
      padding: 25px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    .btn-row {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }

    #joinBtn { background: #007bff; color: #fff; }
    #cancelBtn { background: #dc3545; color: #fff; }
    #closeBtn { background: #6c757d; color: #fff; }

    input {
      width: 80%;
      padding: 8px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 10px;
      text-align: left;
    }

    ul li {
      background: #f2f2f2;
      padding: 6px 10px;
      margin: 5px 0;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>🏃 TRYBE予約カレンダー</h1>
  <div id="calendar"></div>

  <!-- モーダル -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle"></h3>
      <ul id="participantList"></ul>
      <input id="nameInput" placeholder="あなたの名前を入力" />
      <div class="btn-row">
        <button id="joinBtn">参加する</button>
        <button id="cancelBtn" class="cancel">キャンセル</button>
        <button id="closeBtn" class="close">閉じる</button>
      </div>
    </div>
  </div>

  <!-- ✅ ここからメインスクリプト（FullCalendarが確実にロードされた後） -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = "https://axeoezwxjjnghtyfmjnz.supabase.co";
    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4ZW9lend4ampuZ2h0eWZtam56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA4NTE2NjQsImV4cCI6MjA3NjQyNzY2NH0.79UMcuggtqTpbghbXkjtR8g2FYGSTbpasHBd6hcf2Gw";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const LIFF_ID = "2008316836-YLR2y1Zj";

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        window.LINE_USER_ID = profile.userId;
        window.LINE_NAME = profile.displayName;
        console.log("✅ LINEログイン:", profile.displayName);

        initCalendar();
      } catch (error) {
        console.error("LIFF初期化エラー:", error);
      }
    });

    async function initCalendar() {
      const calendarEl = document.getElementById("calendar");

      // ✅ FullCalendarがロードされているか確認
      if (typeof FullCalendar === "undefined") {
        alert("FullCalendarの読み込みに失敗しました。");
        return;
      }

      const { data: events, error } = await supabase.from("calendar_events").select("*");
      if (error) {
        alert("イベント取得エラー: " + error.message);
        return;
      }

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: "dayGridMonth",
        locale: "ja",
        events: events.map((e) => ({
          id: e.id,
          title: e.title,
          start: e.date,
        })),
        eventClick: (info) => openModal(info.event),
      });

      calendar.render();
    }

    async function openModal(event) {
      const modal = document.getElementById("modal");
      const modalTitle = document.getElementById("modalTitle");
      const participantList = document.getElementById("participantList");
      const nameInput = document.getElementById("nameInput");

      modalTitle.textContent = `${event.title}｜${event.startStr} の参加者`;

      const { data: reservations } = await supabase
        .from("reservations")
        .select("user_name")
        .eq("date", event.startStr)
        .eq("status", "reserved");

      participantList.innerHTML = "";
      reservations?.forEach((r) => {
        const li = document.createElement("li");
        li.textContent = r.user_name;
        participantList.appendChild(li);
      });

      nameInput.value = window.LINE_NAME || "";
      modal.style.display = "flex";

      document.getElementById("joinBtn").onclick = async () => {
        const { error } = await supabase.from("reservations").insert([
          {
            user_id: window.LINE_USER_ID,
            user_name: window.LINE_NAME,
            date: event.startStr,
            status: "reserved",
          },
        ]);
        if (error) alert("登録エラー: " + error.message);
        else {
          alert("✅ 予約しました！");
          modal.style.display = "none";
          location.reload();
        }
      };

      document.getElementById("cancelBtn").onclick = async () => {
        const { error } = await supabase
          .from("reservations")
          .update({ status: "canceled" })
          .eq("user_id", window.LINE_USER_ID)
          .eq("date", event.startStr);
        if (error) alert("キャンセルエラー: " + error.message);
        else {
          alert("🚫 キャンセルしました");
          modal.style.display = "none";
          location.reload();
        }
      };

      document.getElementById("closeBtn").onclick = () => {
        modal.style.display = "none";
      };
    }
  </script>
</body>
</html>
