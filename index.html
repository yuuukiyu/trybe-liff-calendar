<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏃 TRYBE予約カレンダー</title>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <!-- LIFF SDK（必ず main.js より先） -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <h1>🏃 TRYBE予約カレンダー</h1>

  <!-- 管理者専用：セッション追加ボタン -->
  <button id="openAdminModalBtn" style="display:none; margin:15px;">＋ セッション追加</button>

  <!-- 管理者モーダル -->
  <div id="adminModal" class="modal">
    <div class="modal-content">
      <h3>📅 新しいセッションを追加</h3>
      <input id="eventTitle" placeholder="タイトル (例: TRYBE朝ラン)" />
      <input id="eventDate" type="date" />
      <input id="eventTime" type="time" />
      <input id="eventPlace" placeholder="場所 (例: 大磯海岸)" />
      <div class="btn-row">
        <button id="addEventBtn">追加</button>
        <button id="closeAdminModalBtn" class="close">閉じる</button>
      </div>
    </div>
  </div>

  <!-- セッション削除モーダル -->
  <div id="deleteSessionModal" class="modal">
    <div class="modal-content">
      <h3>🗑 セッション削除</h3>
      <ul id="deleteSessionList"></ul>
      <div class="btn-row">
        <button id="closeDeleteModal" class="close">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 過去セッションモーダル -->
  <div id="pastSessionsModal" class="modal">
    <div class="modal-content">
      <h3>📜 過去セッション一覧</h3>
      <ul id="pastSessionsList"></ul>
      <div class="btn-row">
        <button id="closePastModal" class="close">閉じる</button>
      </div>
    </div>
  </div>

  <!-- あなたの予約セッション -->
  <div id="mySessions">
    <strong>あなたの予約セッション：</strong>
    <ul id="mySessionList">
      <li>読み込み中...</li>
    </ul>
  </div>

  <!-- カレンダー -->
  <div id="calendar"></div>

  <!-- 詳細表示モーダル -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle"></h3>
      <ul id="participantList"></ul>
      <input id="nameInput" placeholder="あなたの名前を入力" />
      <div class="btn-row">
        <button id="joinBtn">参加する</button>
        <button id="cancelBtn" class="cancel">キャンセル</button>
        <button id="closeBtn" class="close">閉じる</button>
      </div>
    </div>
  </div>

  <!-- main.js（必ず最後に1回だけ！） -->
  <script type="module" src="./main.js?v=1002"></script>

</body>
</html>
